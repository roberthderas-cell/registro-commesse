<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Registro Commesse Bovema</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: banda scura (logo, ruoli, sezioni) · cruscotto, pipeline per fasi, fascicolo di commessa con linea del tempo · demo guidata flottante */
:root{
  --bg:#edf1f5; --surface:#ffffff; --sunk:#f3f6f9; --ink:#111a25; --muted:#586577; --line:#d8dfe7;
  --ember:#df4328; --ember-ink:#ffffff;
  --band:#0e1621; --band-2:#172334; --band-ink:#eef3f8; --band-muted:#97a8bb; --band-line:#26364a;
  --ph-avvio:#3274bd; --ph-prog:#0d8f80; --ph-appr:#cc8106; --ph-cant:#df4328; --ph-fatt:#7552d1; --ph-chiusa:#26914f;
  --good:#1f8146; --good-soft:#e0f2e7; --warn:#a05a00; --warn-soft:#fcefd6; --bad:#bf261b; --bad-soft:#fbe1de; --info:#2c6aae; --info-soft:#e1ecf8;
  --c-ricavo:#2c5e9e; --c-costi:#e09a2f; --c-fatt:#109c8b; --c-inc:#26914f;
  --r-admin:#df4328; --r-direzione:#4c5ab6; --r-commerciale:#0d8f80; --r-tecnico:#3274bd; --r-cantiere:#cc8106; --r-capocantiere:#6a8a21;
  --shade:rgba(8,14,22,.5); --glow:rgba(223,67,40,.35);
  --r-sdi:var(--c-costi); --r-banca:var(--c-inc);
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1219; --surface:#141e29; --sunk:#1b2733; --ink:#e6edf3; --muted:#93a3b4; --line:#273544;
  --ember:#ff6b4c; --ember-ink:#1b0b06;
  --band:#080d13; --band-2:#111b27; --band-ink:#e6edf3; --band-muted:#8597aa; --band-line:#1f2d3d;
  --ph-avvio:#6aa8e8; --ph-prog:#3cc4b1; --ph-appr:#f2ae3d; --ph-cant:#ff6b4c; --ph-fatt:#a68cf2; --ph-chiusa:#5dcb8b;
  --good:#64c98e; --good-soft:#163526; --warn:#eeac45; --warn-soft:#3a2b12; --bad:#f2786d; --bad-soft:#3f1c19; --info:#6aa8e8; --info-soft:#18304a;
  --c-ricavo:#6aa8e8; --c-costi:#f2ae3d; --c-fatt:#3cc4b1; --c-inc:#5dcb8b;
  --r-admin:#ff6b4c; --r-direzione:#8d98ec; --r-commerciale:#3cc4b1; --r-tecnico:#6aa8e8; --r-cantiere:#f2ae3d; --r-capocantiere:#a4c95a;
  --shade:rgba(0,0,0,.62); --glow:rgba(255,107,76,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1219; --surface:#141e29; --sunk:#1b2733; --ink:#e6edf3; --muted:#93a3b4; --line:#273544;
  --ember:#ff6b4c; --ember-ink:#1b0b06;
  --band:#080d13; --band-2:#111b27; --band-ink:#e6edf3; --band-muted:#8597aa; --band-line:#1f2d3d;
  --ph-avvio:#6aa8e8; --ph-prog:#3cc4b1; --ph-appr:#f2ae3d; --ph-cant:#ff6b4c; --ph-fatt:#a68cf2; --ph-chiusa:#5dcb8b;
  --good:#64c98e; --good-soft:#163526; --warn:#eeac45; --warn-soft:#3a2b12; --bad:#f2786d; --bad-soft:#3f1c19; --info:#6aa8e8; --info-soft:#18304a;
  --c-ricavo:#6aa8e8; --c-costi:#f2ae3d; --c-fatt:#3cc4b1; --c-inc:#5dcb8b;
  --r-admin:#ff6b4c; --r-direzione:#8d98ec; --r-commerciale:#3cc4b1; --r-tecnico:#6aa8e8; --r-cantiere:#f2ae3d; --r-capocantiere:#a4c95a;
  --shade:rgba(0,0,0,.62); --glow:rgba(255,107,76,.4); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gut{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- banda ---- */
.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--band-line)}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:44px;min-width:44px;max-width:160px;border-radius:8px;background:#ffffff;border:0;padding:5px 8px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.logo img{max-height:34px;max-width:144px;display:block}
.logo.empty{background:transparent;border:1.5px dashed var(--band-muted);color:var(--band-muted);font-size:11px;line-height:1.15;text-align:center;padding:4px 10px}
.logo.empty:hover{border-color:var(--band-ink);color:var(--band-ink)}
.brand h1{font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1.1}
.brand .sub{font-size:12px;color:var(--band-muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.bbtn{border:1px solid var(--band-line);background:var(--band-2);color:var(--band-ink);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.bbtn:hover{border-color:var(--band-muted)}
.bbtn.go{background:var(--ember);border-color:var(--ember);color:var(--ember-ink)}
.bbtn.go:hover{filter:brightness(1.08)}
.roles{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;align-items:center}
.roles .rl{font-size:12px;color:var(--band-muted);margin-right:4px;white-space:nowrap}
.rchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--band-line);background:transparent;color:var(--band-muted);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:500;transition:background .15s,color .15s}
.rchip .av{width:24px;height:24px;border-radius:50%;background:var(--rc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;font-family:var(--f-mono)}
.rchip:hover{color:var(--band-ink)}
.rchip[aria-pressed="true"]{background:var(--rc);border-color:var(--rc);color:#fff}
.rchip[aria-pressed="true"] .av{background:rgba(255,255,255,.25)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--band-line)}
.nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--band-muted);padding:9px 12px 8px;cursor:pointer;white-space:nowrap;font-weight:500}
.nav button:hover{color:var(--band-ink)}
.nav button[aria-current="true"]{color:var(--band-ink);border-bottom-color:var(--ember)}
.nav .cnt{font-family:var(--f-mono);font-size:11px;background:var(--ember);color:var(--ember-ink);border-radius:9px;padding:0 6px;margin-left:6px;display:inline-block}

main.gut{padding-block:22px 48px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec-h{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-h h2{font-size:17px;font-weight:700}
.sec-h p{margin:0}
.hello{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.hello h2{font-size:24px;font-weight:800;letter-spacing:-.015em}
.hello .who{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.hello .who i{width:10px;height:10px;border-radius:50%;background:var(--rc)}

/* ---- pulsanti e pill ---- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--ember);color:var(--ember)}
.btn.pri{background:var(--ember);border-color:var(--ember);color:var(--ember-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:var(--ember-ink)}
.btn.dang{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.ph{background:color-mix(in srgb,var(--pc) 15%,transparent);color:var(--pc)}
.pill.ph::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc)}

/* ---- KPI ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .k-h{display:flex;align-items:center;gap:8px}
.kpi .ic{width:26px;height:26px;border-radius:7px;background:color-mix(in srgb,var(--kc) 16%,transparent);color:var(--kc);display:flex;align-items:center;justify-content:center}
.kpi .ic svg{width:15px;height:15px}
.kpi .v{font-family:var(--f-display);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .spark{position:absolute;right:0;bottom:0;left:0;height:3px;background:var(--kc);opacity:.55}

.dash{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.dash{grid-template-columns:minmax(0,1fr)}}

/* ---- grafico commesse ---- */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.cmp{display:flex;flex-direction:column}
.cmp-r{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.cmp-r:first-child{border-top:0}
.cmp-r:hover .cmp-n b{color:var(--ember)}
.cmp-n{display:flex;flex-direction:column;min-width:0}
.cmp-n b{font-family:var(--f-mono);font-weight:500;font-size:12.5px}
.cmp-n span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-b{display:flex;flex-direction:column;gap:3px;min-width:0}
.hb{display:flex;align-items:center;gap:8px;font-size:11px;font-family:var(--f-mono);color:var(--muted)}
.hb i{display:block;height:7px;border-radius:4px;background:var(--c);transform-origin:left}
@media (max-width:560px){.cmp-r{grid-template-columns:minmax(0,1fr)}}

/* ---- avvisi ---- */
.al{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.al:first-child{border-top:0}
.al .sv{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--f-mono);font-size:13px;background:var(--info-soft);color:var(--info)}
.al.bad .sv{background:var(--bad-soft);color:var(--bad)} .al.warn .sv{background:var(--warn-soft);color:var(--warn)}
.al .tt{font-weight:600;font-size:13.5px}
.al .dd{font-size:12px;color:var(--muted)}
.alerts{max-height:380px;overflow:auto}

/* ---- pipeline ---- */
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:color-mix(in srgb,var(--pc) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--pc) 30%,var(--line));border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.col header{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:13.5px;color:var(--pc);padding:2px 4px}
.col header .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;background:var(--pc);color:#fff;border-radius:9px;padding:0 7px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s,border-color .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px -8px var(--shade);border-color:var(--pc)}
.pcard .t1{display:flex;justify-content:space-between;gap:6px;align-items:center}
.pcard .cod{font-family:var(--f-mono);font-size:12px;color:var(--pc);font-weight:500}
.pcard .cl{font-weight:600}
.pcard .ob{font-size:12px;color:var(--muted)}
.pcard .ft{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.mini{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;display:block}
.mini i{display:block;height:100%;background:var(--pc);border-radius:3px;transform-origin:left}
.adot{font-family:var(--f-mono);font-size:11px;background:var(--ember);color:var(--ember-ink);border-radius:9px;padding:0 6px}
.empty{font-size:12px;color:var(--muted);text-align:center;margin:18px 0}

/* ---- commesse ---- */
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.clist{display:flex;flex-direction:column;overflow:hidden}
.ci{display:flex;flex-direction:column;gap:5px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px 12px 12px;cursor:pointer;border-left:4px solid transparent}
.ci:first-child{border-top:0}
.ci:hover{background:var(--sunk)}
.ci[aria-current="true"]{background:color-mix(in srgb,var(--pc) 10%,var(--surface));border-left-color:var(--pc)}
.ci .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ci .cod{font-family:var(--f-mono);font-weight:500;font-size:12.5px;color:var(--pc)}
.ci .cl{font-weight:600}
.ci .ob{font-size:12px;color:var(--muted)}
.dh{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-start}
.dh h2{font-size:23px;font-weight:800;letter-spacing:-.015em}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-top:10px}
.chips span b{font-weight:500;color:var(--muted);margin-right:4px}
.big-r{text-align:right}
.big-r .v{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}

/* stepper */
.steps{list-style:none;margin:18px 0 0;padding:0;display:flex;overflow-x:auto;gap:4px}
.steps li{flex:1 0 98px;display:flex;flex-direction:column;gap:7px;font-size:11.5px;color:var(--muted);padding:0 2px 2px}
.steps li i{height:6px;border-radius:3px;background:var(--line);display:block}
.steps li.done i{background:var(--pc)}
.steps li.done{color:var(--ink)}
.steps li.cur i{background:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 28%,transparent)}
.steps li.cur{color:var(--pc);font-weight:700}
.stbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:14px}
.reason{font-size:12px;color:var(--warn)}
.blk{background:var(--bad-soft);color:var(--bad);border-radius:7px;padding:8px 12px;font-size:13px;font-weight:500;margin-top:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ember)}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px}
.fig{display:flex;flex-direction:column;gap:2px;min-width:0}
.fig .v{font-family:var(--f-mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.fig .v.big{font-family:var(--f-display);font-size:20px;font-weight:700}
.pos{color:var(--good)} .neg{color:var(--bad)} .wrn{color:var(--warn)}
.rings{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
.ring{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.ring .rl{font-weight:600;font-size:13px}
.ring .rs{font-size:12px;max-width:150px}
.gap-note{flex:1 1 220px;min-width:0;font-size:13px;border-radius:8px;padding:12px 14px;background:var(--warn-soft);color:var(--warn)}
.gap-note.ok{background:var(--good-soft);color:var(--good)}
.stk{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.stk i{display:block;height:100%;transform-origin:left}
.bar{height:8px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--ph-avvio));border-radius:5px;transform-origin:left}
.note{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:11px 13px}
.note code{font-family:var(--f-mono);font-size:12px;color:var(--ink)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t th.num{text-align:right}
tfoot td{font-weight:600}
.m3{display:inline-flex;gap:3px}
.m3 span{font-family:var(--f-mono);font-size:10.5px;border-radius:4px;padding:1px 5px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.m3 span.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.m3 span.pt{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* linea del tempo */
.tlf{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tlf button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px 3px 8px;font-size:12px;cursor:pointer}
.tlf button i{width:9px;height:9px;border-radius:50%;background:var(--tc)}
.tlf button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;display:grid;grid-template-columns:32px 92px minmax(0,1fr);gap:10px;padding:7px 0;align-items:start}
.tl .ic{width:32px;height:32px;border-radius:50%;background:var(--tc);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600;font-size:12px;position:relative;z-index:1;box-shadow:0 0 0 4px var(--surface)}
.tl .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:7px}
.tl .x{padding-top:5px;min-width:0}
.tl .x b{font-weight:600}
.tl .x div{font-size:12.5px;color:var(--muted)}
.tl li.today .ic{background:var(--ink);color:var(--surface)}
.tl li.fut .ic{background:var(--surface);color:var(--tc);border:2px dashed var(--tc)}
.tl li.fut.late .x b{color:var(--bad)}
@media (max-width:520px){.tl li{grid-template-columns:32px minmax(0,1fr)}.tl .d{grid-column:2;padding-top:0}.tl .x{grid-column:2;padding-top:0}}

/* SDI e ruoli */
.sdi{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.sdi article{display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chk{font-size:13px;display:flex;flex-direction:column;gap:4px}
.chk div::before{content:"✓ ";color:var(--good);font-weight:700}
.chk div.x::before{content:"! ";color:var(--warn);font-weight:700}
.mx td.c,.mx th.c{text-align:center}
.mx th.c span{display:inline-flex;align-items:center;gap:5px}
.mx th.c span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rc)}
.mx .F{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--rc)}
.mx .V{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--rc)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;width:100%}

/* modale, toast, tour */
.ov{position:fixed;inset:0;background:var(--shade);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.mo{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(460px,100%);max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.mo h3{font-size:17px}
.fmsg{font-size:13px;border-radius:7px;padding:8px 10px;background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:10px;padding:11px 16px;font-size:13px;z-index:70;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px -10px var(--shade)}
.toast i{width:10px;height:10px;border-radius:50%;background:var(--tc,var(--good));flex-shrink:0}
.tour{position:fixed;z-index:60;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px -14px var(--shade);overflow:hidden}
.tour .tp{height:4px;background:var(--sunk)} .tour .tp i{display:block;height:100%;background:var(--ember);transition:width .3s}
.tour .tb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px}
.tour .th{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tour .who{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--rc)}
.tour .who i{width:9px;height:9px;border-radius:50%;background:var(--rc)}
.tour h3{font-size:16.5px}
.tour p{margin:0;font-size:13.5px;color:var(--muted)}
.tour .x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px}
.tour .done{font-size:12.5px;color:var(--good);font-weight:600}
.hl{outline:3px solid var(--ember);outline-offset:4px;border-radius:10px;box-shadow:0 0 0 10px var(--glow)}
@media (max-width:640px){.tour{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto}}
footer.gut{padding-block:0 30px;font-size:12px;color:var(--muted)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

/* dinamica: diretta, flusso, incassi, attività, trascinamento */
.bbtn.live[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.bbtn .lv{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:7px;vertical-align:1px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.ptools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ptools .search{max-width:320px}
.hint{font-size:12.5px}
.pcard[draggable="true"]{cursor:grab}
.pcard.dragging{opacity:.4}
.col.over{outline:2px dashed var(--pc);outline-offset:-5px;background:color-mix(in srgb,var(--pc) 16%,var(--surface))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.two{grid-template-columns:1fr}}
.toast b{font-weight:700}
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:22px}
.fnode{position:relative;text-align:left;background:color-mix(in srgb,var(--kc) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--kc) 35%,var(--line));border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:transform .15s}
.fnode:hover{transform:translateY(-2px)}
.fnode .fh{display:flex;align-items:center;gap:6px;min-width:0}
.fdot{width:9px;height:9px;border-radius:50%;background:var(--kc);flex-shrink:0}
.fnode .fv{font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fnode .fs{font-size:11.5px;color:var(--muted)}
.fnode:not(:last-child)::after{content:"";position:absolute;left:100%;top:50%;width:22px;height:3px;margin-top:-1.5px;background:repeating-linear-gradient(90deg,var(--kc) 0 6px,transparent 6px 11px);background-size:11px 100%}
@media (max-width:1100px){.flow{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.fnode::after{display:none}}
.cash{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.cc{display:flex;flex-direction:column;gap:4px;min-width:0;text-align:center}
.cv{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-height:15px;white-space:nowrap}
.cb{height:140px;display:flex;flex-direction:column-reverse;background:var(--sunk);border-radius:6px;overflow:hidden}
.cb i{display:block;width:100%;transform-origin:bottom;flex-shrink:0}
.cl{font-size:11.5px;color:var(--muted);white-space:nowrap}
.feed{max-height:390px;overflow:auto}
.fi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 16px;border-top:1px solid var(--line)}
.fi:first-child{border-top:0}
.fi .ic{width:28px;height:28px;border-radius:50%;background:var(--tc);color:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;font-weight:700}
.fi b{font-weight:600;font-size:13px;display:block}
.fi div div{font-size:12px;color:var(--muted)}
.fi .tm{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.fi.new{background:color-mix(in srgb,var(--tc) 9%,transparent)}

/* professionale: report, documenti, impostazioni, ricerca comandi, scheda, stampa */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-left:1px solid var(--line);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px}
table.t th.sort{cursor:pointer;user-select:none}
table.t th.sort:hover{color:var(--ink)}
table.t th .ar{font-size:10px;margin-left:3px}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunk)}
.mbar{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.mbar i{display:block;height:6px;border-radius:3px;background:var(--c)}
.vbar{display:grid;grid-template-columns:160px minmax(0,1fr) 120px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.vbar:first-of-type{border-top:0}
.vbar .tr{position:relative;height:22px}
.vbar .tr i{position:absolute;left:0;height:9px;border-radius:4px;transform-origin:left}
.vbar .tr i.b{top:0;background:var(--line)}
.vbar .tr i.e{top:12px;background:var(--c)}
@media (max-width:600px){.vbar{grid-template-columns:minmax(0,1fr) 110px}.vbar .tr{grid-column:1/-1;grid-row:2}}
.entry{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 18px}
.entry .h{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.entry .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.docs{display:flex;flex-direction:column}
.doc{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.doc:first-child{border-top:0}
.doc .di{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--sunk);color:var(--muted)}
.doc.ok .di{background:var(--good-soft);color:var(--good)}
.doc.miss .di{background:var(--bad-soft);color:var(--bad)}
.doc .dn{font-weight:600}
.doc .dm{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.doc .dm .fn{font-family:var(--f-mono);color:var(--ink)}
@media (max-width:520px){.doc{grid-template-columns:34px minmax(0,1fr)}.doc .row{grid-column:2}}
.docmeter{display:flex;align-items:center;gap:12px;font-size:13px}
.docmeter .bar{flex:1}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cfg small{color:var(--muted);font-size:12px}
.pal-ov{position:fixed;inset:0;background:var(--shade);z-index:90;display:flex;justify-content:center;align-items:flex-start;padding:max(10vh,16px) 16px 16px}
.pal{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 60px -18px var(--shade);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.pal input{border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:15px;background:var(--surface);outline:none}
.pal ul{list-style:none;margin:0;padding:6px;overflow:auto}
.pal li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer}
.pal li[aria-selected="true"]{background:var(--sunk)}
.pal li .k{font-size:11px;color:var(--muted);margin-left:auto;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pal li .dot{background:var(--pc,var(--muted));flex-shrink:0}
.pal .ft{border-top:1px solid var(--line);padding:8px 14px;font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.75}
.mo.sheet{width:min(860px,100%);gap:18px}
.sheet .sh-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.sheet .sh-h img{max-height:36px;display:block}
.sheet h4{font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px;color:var(--muted)}
.statusbar{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
@media print{
  body{background:#fff;color:#000}
  body::before{display:none}
  body.printing > *:not(#modal){display:none!important}
  body.printing .ov{position:static;background:none;padding:0;display:block}
  body.printing .mo{border:0;box-shadow:none;max-height:none;overflow:visible;width:100%;padding:0}
  .noprint{display:none!important}
}

@media (prefers-reduced-motion:no-preference){
  .anim .grow{animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
  .anim .rise{animation:rise .45s ease-out both}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes rise{from{opacity:.001;transform:translateY(6px)}}
  .steps li.cur i{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--pc) 12%,transparent)}}
  .hl{animation:hlp 1.6s ease-in-out infinite}
  @keyframes hlp{50%{box-shadow:0 0 0 16px transparent}}
  .toast{animation:tin .25s ease-out}
  .fnode::after{animation:flowd .9s linear infinite}
  @keyframes flowd{to{background-position:11px 0}}
  .anim .up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{transform:scaleY(0)}}
  .kpi.flash,.fnode.flash{animation:flash 1.3s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 4px color-mix(in srgb,var(--kc) 60%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
  .fi.new{animation:slidein .7s ease-out}
  @keyframes slidein{from{opacity:.001;transform:translateX(-14px)}}
  .nav .cnt.bump{animation:bump .8s ease-out}
  @keyframes bump{30%{transform:scale(1.5)}}
  .bbtn.live[aria-pressed="true"] .lv,.livep{animation:blink 1.2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  .anim .pcard.pop,.pcard.pop{animation:pop .9s ease-out}
  @keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.04);box-shadow:0 0 0 10px var(--glow)}100%{transform:none}}
  .shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  @keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
}

/* v5: scadenzario, anagrafiche, controlli */
.fc{display:grid;grid-template-columns:repeat(13,minmax(34px,1fr));gap:6px;align-items:end;min-width:520px}
.fc .w{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.fc .bars{display:flex;gap:3px;align-items:flex-end;height:130px;width:100%;justify-content:center;border-bottom:1px solid var(--line)}
.fc .bars i{flex:1;max-width:14px;border-radius:3px 3px 0 0;transform-origin:bottom}
.fc .sd{font-size:10.5px;font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.fc .sd.neg{color:var(--bad)}
.fc .wl{font-size:10.5px;color:var(--muted);white-space:nowrap}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk .ck-ok,.chk .ck-ko{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.chk .ck-ok{background:var(--good)}.chk .ck-ko{background:var(--warn)}
.chk ul{grid-column:2/-1;margin:2px 0 0;padding-left:18px;font-size:13px}
.chk .d{color:var(--muted);font-size:12.5px}
.age{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.age>div{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--sunk)}
.age>div.late{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.age .v{display:block;font-family:var(--f-mono);font-weight:500;font-size:15px;margin-top:2px}
@media (max-width:700px){.age{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== v8: layout con menu laterale ===== */
html{scroll-padding-top:80px}
body::before{display:none}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--band);color:var(--band-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid var(--band-line);scrollbar-width:thin}
.side .brand{padding:20px 18px 16px;gap:12px;border-bottom:1px solid var(--band-line)}
.side .brand h1{font-size:17px}
.side .brand .sub{font-size:11.5px}
.side .logo{height:40px;min-width:40px;max-width:96px}
.side .logo img{max-height:30px;max-width:80px}
.side .nav{flex-direction:column;gap:1px;overflow:visible;border:0;padding:10px 10px 6px}
.side .ng{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--band-muted);font-weight:600;padding:14px 10px 5px;opacity:.85}
.side .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;border-radius:8px;padding:8px 10px;color:var(--band-muted);font-weight:500;position:relative}
.side .nav button svg{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.side .nav button:hover{background:var(--band-2);color:var(--band-ink)}
.side .nav button[aria-current="true"]{background:var(--band-2);color:#fff;border:0}
.side .nav button[aria-current="true"]::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--ember)}
.side .nav .cnt{margin-left:auto;background:color-mix(in srgb,var(--ember) 85%,transparent);font-size:10.5px;padding:0 6px;line-height:17px}
.side-roles{margin-top:auto;padding:12px 12px 18px;border-top:1px solid var(--band-line)}
.side-roles .roles{flex-direction:column;align-items:stretch;gap:3px;overflow:visible;padding:0}
.side-roles .rl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin:0 0 6px 4px;color:var(--band-muted)}
.side-roles .rchip{border:0;border-radius:8px;padding:5px 8px 5px 5px;width:100%;font-size:13px}
.side-roles .rchip:hover{background:var(--band-2)}
.side-roles .rchip[aria-pressed="true"]{background:var(--band-2);color:#fff;box-shadow:inset 3px 0 0 var(--rc)}
.side-roles .rchip[aria-pressed="true"] .av{background:var(--rc)}
.mainc{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px max(24px,env(safe-area-inset-right,0px)) 10px 28px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.crumb i{width:8px;height:8px;border-radius:50%;background:var(--rc);flex-shrink:0}
.topbar .bbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:500;font-size:13px}
.topbar .bbtn:hover{border-color:var(--ink)}
.topbar .bbtn.go{background:var(--ember);border-color:var(--ember);color:var(--ember-ink);font-weight:600}
.topbar .bbtn.live[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.topbar kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted);margin-left:4px}
.mainc main.gut{max-width:1280px;width:100%;margin:0 auto;padding:26px 28px 48px}
.mainc .statusbar{max-width:1280px;width:100%;margin:0 auto;padding:14px 28px 22px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
/* tono più sobrio */
.hello h2{font-size:22px}
.panel{border-radius:12px;box-shadow:0 1px 2px rgba(15,25,40,.04)}
.kpi{border-radius:12px;box-shadow:0 1px 2px rgba(15,25,40,.04)}
.kpi .spark{height:2px;opacity:.7}
.fnode{background:var(--surface);border-color:var(--line);border-top:3px solid var(--kc)}

    c.varianti.filter(v=>v.stato==='proposta').forEach(v=>out.push({sev:'info',cod:c.cod,tit:`Variante da approvare: ${v.descr}`,det:eur(v.importo)+' · proposta da '+v.da,go:{tab:'riepilogo'}}));
    c.piano.forEach(p=>{const r=rata(c,p,k);
      if(r.fb)out.push({sev:'info',cod:c.cod,tit:`Rata fatturabile: ${p.descr}`,det:eur(p.importo)+' · '+TRIG[p.trigger],go:{tab:'fatturazione'}});
      if(r.late)out.push({sev:'bad',cod:c.cod,tit:`Incasso scaduto da ${r.late} giorni`,det:`${p.fattura.num} · ${eur(p.importo)}`,go:{tab:'fatturazione'}});});
    const md=missingDocs(c,c.stato);if(c.stato<8&&md.length)out.push({sev:'warn',cod:c.cod,tit:'Documenti di fase mancanti',det:md.map(d=>d.l).join(', '),go:{tab:'documenti'}});
    if(c.stato<8&&k.sostenuto>k.budget)out.push({sev:'warn',cod:c.cod,tit:`Costi oltre budget (+${pct(k.sostenuto/k.budget-1)})`,det:`${eur(k.sostenuto)} su ${eur(k.budget)}`,go:{tab:'riepilogo'}});
    if(c.stato<8&&k.margPct<D.cfg.sogliaMarg/100)out.push({sev:'bad',cod:c.cod,tit:`Margine previsto sotto il ${D.cfg.sogliaMarg}% (${pct(k.margPct)})`,det:'Verificare costi e varianti',go:{tab:'riepilogo'}});
    if(c.stato>=4&&c.stato<6&&k.avanz-k.c2c*100>=D.cfg.sogliaGap)out.push({sev:'warn',cod:c.cod,tit:'Cantiere più avanti dei costi registrati',det:`Cantiere ${k.avanz}% · costi ${pct(k.c2c)}: possibili fatture non registrate`,go:{tab:'riepilogo'}});
  });
  const o={bad:0,warn:1,info:2};return out.sort((a,b)=>o[a.sev]-o[b.sev]);
}

  c.piano.forEach(p=>{if(p.fattura)E.push({d:p.fattura.data,ty:'fatt',t:`Fattura ${p.fattura.num}`,s:p.descr+(s.r?' · '+eur(p.importo):'')});if(p.incasso)E.push({d:p.incasso.data,ty:'incasso',t:`Incasso ${p.fattura.num}`,s:s.r?eur(p.importo):'Incasso registrato'});

/* ================= modale, toast, effetti ================= */
function modal(title,fields,submitLabel,onSubmit){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="ov" data-close="1"><form class="mo" id="mf" novalidate><h3>${title}</h3>${fields}<div id="fmsg"></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close="1">Annulla</button><button type="submit" class="btn pri">${submitLabel}</button></div></form></div>`;
  const f=document.getElementById('mf'),first=f.querySelector('input,select,textarea');if(first)first.focus();
  f.addEventListener('submit',e=>{e.preventDefault();const err=onSubmit(f);if(err){document.getElementById('fmsg').innerHTML=`<div class="fmsg">${esc(err)}</div>`;return;}m.innerHTML='';render();});
}
const closeModal=()=>{document.getElementById('modal').innerHTML='';};
const fld=(id,l,inp)=>`<div class="fld"><label class="lbl" for="${id}">${l}</label>${inp}</div>`;
function toast(t,tone,rk){const el=document.getElementById('toast');const col=rk?`--r-${rk}`:tone==='warn'?'--warn':tone==='bad'?'--bad':'--good';el.innerHTML=`<div class="toast" role="status" style="--tc:var(${col})"><i></i><span>${rk?`<b>${esc(AL(rk))}</b> · `:''}${esc(t)}</span></div>`;clearTimeout(toast.h);toast.h=setTimeout(()=>{el.innerHTML='';},3400);}
function celebrate(){
  if(reduced())return;const cv=document.getElementById('fx');cv.hidden=false;const x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cs=getComputedStyle(document.documentElement),cols=['--ph-avvio','--ph-prog','--ph-appr','--ph-cant','--ph-fatt','--ph-chiusa'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:Math.random()*6+4,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(t-t0<1700)requestAnimationFrame(f);else{x.clearRect(0,0,cv.width,cv.height);cv.hidden=true;}})(t0);
}

/* ================= azioni ================= */
function act(a,id,quiet){
  const c=C(S.sel);let msg='',tone='good';
  switch(a){
  case 'pag':{const [cd,ix]=String(id).split('|'),cc=C(cd),f=cc&&cc.fp[+ix];if(!f||f.pag)return false;f.pag=OGGI;addLog(cd,`Registrato pagamento fattura ${f.num} di ${f.fornitore} (${eur(f.importo)})`);msg=`Pagamento di ${eur(f.importo)} a ${f.fornitore} registrato`;break;}
  case 'advance':{const k=calc(c);if(guard(c,k)||c.stato>=8)return false;const from=STATI[c.stato];c.stato++;addLog(c.cod,`Stato: da «${from}» a «${STATI[c.stato]}»`);msg=`${c.cod} passata a «${STATI[c.stato]}»`;S.flash=c.cod;if(c.stato===8)setTimeout(celebrate,60);break;}
  case 'back':c.stato--;addLog(c.cod,`Stato riportato a «${STATI[c.stato]}»`);msg='Stato riportato indietro';tone='warn';break;
  case 'block':c.bloccata=!c.bloccata;addLog(c.cod,c.bloccata?'Commessa bloccata':'Commessa sbloccata');msg=c.bloccata?'Commessa bloccata':'Commessa sbloccata';tone=c.bloccata?'bad':'good';break;
  case 'ord-ok':{const o=c.ordini.find(x=>x.id===id);if(!o||o.stato!=='Autorizzazione richiesta')return false;o.stato='Ordinato';o.nota=`Autorizzato oltre budget il ${fd(OGGI)}`;addLog(c.cod,`Autorizzato ordine ${o.id} oltre budget (${eur(o.importo)})`);msg='Ordine autorizzato e trasmesso al fornitore';break;}
  case 'ord-no':{const o=c.ordini.find(x=>x.id===id);o.stato='Respinto';o.nota='Respinto dall\'amministrazione: rivedere quantità o fornitore';addLog(c.cod,`Respinto ordine ${o.id}`);msg='Ordine respinto';tone='warn';break;}
  case 'consegna':{const o=c.ordini.find(x=>x.id===id);o.stato='Consegnato';o.cons=OGGI;addLog(c.cod,`Confermata consegna ordine ${o.id}`);msg='Consegna confermata';break;}
  case 'var-ok':{const v=c.varianti.find(x=>x.id===id);v.stato='approvata';c.piano.push({id:'R'+v.id,descr:`Variante ${v.id}, ${v.descr}`,importo:v.importo,trigger:'collaudo'});addLog(c.cod,`Approvata variante ${v.id} (${eur(v.importo)}), aggiunta al piano di fatturazione`);msg='Variante approvata e aggiunta al piano di fatturazione';break;}
  case 'var-no':{const v=c.varianti.find(x=>x.id===id);v.stato='respinta';addLog(c.cod,`Respinta variante ${v.id}`);msg='Variante respinta';tone='warn';break;}
  case 'collaudo':if(c.collaudoOk)return false;c.collaudoOk=true;c.collaudoData=OGGI;['collaudo','dichimp','manuale'].forEach(dk=>{if(!c.docs[dk])c.docs[dk]={file:`${DOCF[dk]}_${c.cod}.pdf`,data:OGGI,chi:AL(S.role)};});addLog(c.cod,'Registrati collaudo e DICH.IMP.');msg='Collaudo registrato: le rate di saldo sono fatturabili';break;
  case 'emetti':{const p=c.piano.find(x=>x.id===id);if(!p||p.fattura)return false;p.fattura={num:'FA 2026/'+(D.nFA++),data:OGGI,scad:addDays(OGGI,D.cfg.ggPag)};addLog(c.cod,`Emessa fattura ${p.fattura.num} (${p.descr}, ${eur(p.importo)})`);msg=`Fattura ${p.fattura.num} emessa, scadenza ${fd(p.fattura.scad)}`;break;}
  case 'incasso':{const p=c.piano.find(x=>x.id===id);if(!p||!p.fattura||p.incasso)return false;p.incasso={data:OGGI};addLog(c.cod,`Registrato incasso fattura ${p.fattura.num} (${eur(p.importo)})`);msg='Incasso registrato';break;}
  case 'sdi-reg':{
    const f=D.sdi.find(x=>x.id===id);if(!f)return false;const m=f.rif&&findOrd(f.rif);
    if(m){m.c.fp.push({num:f.num,fornitore:f.fornitore,ordine:m.o.id,cat:m.o.cat,importo:f.importo,data:f.data});lg(S.role,m.c.cod,`Registrata fattura passiva ${f.num} di ${f.fornitore} su ordine ${m.o.id} (${eur(f.importo)})`);msg=`Fattura registrata sulla ${m.c.cod}`;}
    else{const sc=document.getElementById('sc-'+id),sv=document.getElementById('sv-'+id),cod=sc?sc.value:'',cat=sv?sv.value:'Materiali';
      if(cod)C(cod).fp.push({num:f.num,fornitore:f.fornitore,ordine:null,cat,importo:f.importo,data:f.data});
      lg(S.role,cod||null,`Registrata fattura passiva ${f.num} di ${f.fornitore} senza ordine (${eur(f.importo)})${cod?'':' come costo generale'}`);msg=cod?`Fattura assegnata alla ${cod}`:'Fattura registrata come costo generale';}
    D.sdi=D.sdi.filter(x=>x.id!==id);break;}
  case 'new-ord':{const k=calc(c);
    modal(`Nuovo ordine · ${c.cod}`,
      fld('o-f','Fornitore','<input id="o-f" list="forn" autocomplete="off"><datalist id="forn"><option>Metalfer Lombarda S.r.l.</option><option>Elettro Quadri Brianza S.r.l.</option><option>Trasporti Ghezzi S.n.c.</option><option>Montaggi Adda S.r.l.</option><option>Aria Tecnica Veneta S.p.A.</option></datalist>')+
      fld('o-c','Voce di budget',`<select id="o-c">${k.cats.filter(x=>x.k!=='Manodopera interna').map(x=>`<option value="${x.k}">${x.k} · residuo ${eur(x.residuo)}</option>`).join('')}</select>`)+
      fld('o-d','Descrizione','<input id="o-d">')+fld('o-i','Imponibile (€)','<input id="o-i" inputmode="decimal" placeholder="es. 4.500">'),
      'Emetti ordine',f=>{const forn=f.querySelector('#o-f').value.trim(),cat=f.querySelector('#o-c').value,descr=f.querySelector('#o-d').value.trim(),imp=parseFloat(f.querySelector('#o-i').value.replace(/\./g,'').replace(',','.'));
        if(!forn||!descr)return 'Indica fornitore e descrizione.';if(!(imp>0))return 'Indica un importo valido.';
        const res=calc(c).cats.find(x=>x.k===cat).residuo,over=imp>res;
        const o={id:'ODA-26-0'+(D.nODA++),fornitore:forn,cat,descr,importo:imp,data:OGGI,stato:over?'Autorizzazione richiesta':'Ordinato'};
        if(over)o.nota=`Supera il residuo della voce ${cat} di ${eur(imp-res)}`;
        c.ordini.push(o);addLog(c.cod,over?`Ordine ${o.id} inviato in autorizzazione: supera il budget ${cat}`:`Emesso ordine ${o.id} a ${forn} (${eur(imp)})`);
        toast(over?`Supera il budget: ${o.id} inviato all'amministrazione per autorizzazione`:`Ordine ${o.id} emesso`,over?'warn':'good');});
    return;}
  case 'new-rap':{const k=calc(c);
    modal(`Rapportino · ${c.cod}`,fld('r-o','Ore lavorate dalla squadra','<input id="r-o" inputmode="numeric" placeholder="es. 40">')+fld('r-a',`Avanzamento complessivo (%) · ultimo ${k.avanz}%`,`<input id="r-a" inputmode="numeric" value="${k.avanz}">`)+fld('r-n','Note','<textarea id="r-n" rows="2" placeholder="Lavorazioni eseguite, problemi, materiali mancanti"></textarea>'),
      'Salva rapportino',f=>{const ore=parseInt(f.querySelector('#r-o').value,10),av=parseInt(f.querySelector('#r-a').value,10),nota=f.querySelector('#r-n').value.trim();
        if(!(ore>=0))return 'Indica le ore lavorate.';if(!(av>=k.avanz&&av<=100))return `L'avanzamento deve essere tra ${k.avanz}% e 100%.`;
        c.rapportini.push(R(OGGI,is('capocantiere')?CAPO:RL(S.role),ore,av,nota||'—'));addLog(c.cod,`Rapportino: ${ore} h, avanzamento ${av}%`);toast('Rapportino salvato');});
    return;}
  case 'sheet':openSheet(c);return;
  case 'reset-ask':
    modal('Ripristinare i dati di esempio?','<p class="muted" style="margin:0">Tutte le modifiche fatte su commesse, ordini, documenti e impostazioni andranno perse.</p>','Ripristina',()=>{doReset();toast('Dati di esempio ripristinati');});
    return;
  case 'doc-up':{const d=DOCS.find(x=>x.k===id);if(!d)return;
    modal(`Carica documento · ${c.cod}`,`<p style="margin:0;font-weight:600">${d.l}</p>`+fld('d-f','File dal computer','<input id="d-f" type="file">')+fld('d-n','Nome registrato nel fascicolo',`<input id="d-n" value="${DOCF[d.k]}_${c.cod}.pdf">`),'Registra documento',f=>{
      const fi=f.querySelector('#d-f'),nm=(fi&&fi.files&&fi.files[0])?fi.files[0].name:f.querySelector('#d-n').value.trim();
      if(!nm)return 'Scegli un file o indica il nome del documento.';
      c.docs[d.k]={file:nm,data:OGGI,chi:AL(S.role)};addLog(c.cod,`Caricato documento: ${d.l} (${nm})`);toast('Documento registrato: '+d.l);});
    return;}
  case 'doc-rm':{const d=DOCS.find(x=>x.k===id);if(!d||!c.docs[d.k])return false;delete c.docs[d.k];addLog(c.cod,`Rimosso documento: ${d.l}`);msg='Documento rimosso dal fascicolo';tone='warn';break;}
  case 'new-com':
    modal('Nuova commessa',
      fld('nc-c','Cliente','<input id="nc-c" placeholder="Ragione sociale">')+fld('nc-o','Oggetto','<input id="nc-o" placeholder="es. Evacuazione naturale, capannone">')+
      `<div class="two">${fld('nc-s','Sistema',`<select id="nc-s">${['ENFC','SEFFC','PDS','Barriere','Ventilazione','Centrale'].map(x=>`<option>${x}</option>`).join('')}</select>`)}${fld('nc-l','Cantiere','<input id="nc-l" placeholder="Città (PR)">')}</div>`+
      `<div class="two">${fld('nc-i','Valore contratto (€)','<input id="nc-i" inputmode="decimal" placeholder="es. 120.000">')}${fld('nc-m','Margine obiettivo (%)','<input id="nc-m" inputmode="decimal" value="32">')}</div>`+
      fld('nc-p','Piano di fatturazione',`<select id="nc-p">${Object.entries(PIANI).map(([k,p])=>`<option value="${k}">${p.l}</option>`).join('')}</select>`)+
      '<p class="muted" style="margin:0;font-size:12px">Il budget costi per voce viene proposto dal margine obiettivo; l\'ufficio tecnico lo affina in progettazione.</p>',
      'Crea commessa',f=>{const g=id=>f.querySelector('#'+id).value.trim();const ric=parseFloat(g('nc-i').replace(/\./g,'').replace(',','.')),m=parseFloat(g('nc-m').replace(',','.'));
        if(!g('nc-c')||!g('nc-o'))return 'Indica cliente e oggetto.';if(!(ric>0))return 'Indica il valore del contratto.';if(!(m>=0&&m<90))return 'Il margine obiettivo deve essere tra 0 e 90%.';
        const cod=newCommessa({cliente:g('nc-c'),oggetto:g('nc-o'),sistema:g('nc-s'),cantiere:g('nc-l'),ricavo:ric,piano:g('nc-p'),marg:m,commerciale:is('commerciale')?'L. Bianchi':RL(S.role)});
        addLog(cod,`Contratto firmato e caricato (${eur(ric)})`);S.flash=cod;S.anim=true;toast(`Commessa ${cod} creata: l'anticipo è già fatturabile`);});
    return;
  case 'new-var':
    modal(`Proponi variante · ${c.cod}`,fld('v-d','Descrizione','<input id="v-d">')+fld('v-i','Importo (€)','<input id="v-i" inputmode="decimal">'),'Invia all\'amministrazione',f=>{
      const d=f.querySelector('#v-d').value.trim(),imp=parseFloat(f.querySelector('#v-i').value.replace(/\./g,'').replace(',','.'));
      if(!d||!(imp>0))return 'Indica descrizione e importo.';
      const vid='V'+(c.varianti.length+1);c.varianti.push({id:vid,descr:d,importo:imp,stato:'proposta',da:is('commerciale')?'L. Bianchi':RL(S.role),data:OGGI});addLog(c.cod,`Proposta variante ${vid} da ${eur(imp)}`);toast('Variante inviata in approvazione');});
    return;
  }
  if(!quiet){toast(msg,tone);render();}
  return true;
}

/* ================= documenti ================= */
function tDocumenti(c){
  const ok=DOCS.filter(d=>c.docs[d.k]).length, md=missingDocs(c,c.stato);
  return `<div class="stack"><div class="sec-h"><h2>Documenti di commessa</h2><p class="muted">Ogni fase richiede i suoi documenti: se mancano, la commessa non avanza</p></div>
  <div class="docmeter"><span class="mono">${ok}/${DOCS.length}</span><div class="bar" style="--c:var(${md.length?'--c-costi':'--good'})"><i class="grow" style="width:${ok/DOCS.length*100}%"></i></div>${md.length?`<span class="pill warn">${md.length} mancanti</span>`:'<span class="pill good">In regola</span>'}</div>
  <div class="docs">${DOCS.map(d=>{const v=c.docs[d.k],due=dueAt(d,c.stato),can=is('admin')||is(d.chi)||(d.chi==='cantiere'&&is('capocantiere')&&c.capo===CAPO);
    return `<div class="doc ${v?'ok':due?'miss':''}"><span class="di">${v?'✓':due?'!':'·'}</span><div style="min-width:0"><div class="dn">${d.l}</div><div class="dm">${v?`<span class="fn">${esc(v.file)}</span> · ${esc(v.chi)} · ${fd(v.data)}`:`Richiesto dalla fase «${STATI[d.fase]}» · a cura di ${RL(d.chi)}`}</div></div><div class="row">${!v&&can?`<button class="btn sm ${due?'pri':''}" data-act="doc-up" data-id="${d.k}">Carica</button>`:''}${v&&is('admin')?`<button class="btn sm" data-act="doc-rm" data-id="${d.k}">Rimuovi</button>`:''}${!v&&!due&&!can?'<span class="pill">Non ancora richiesto</span>':''}</div></div>`;}).join('')}</div>
  <div class="note">Nel tool definitivo i file restano archiviati nel fascicolo della commessa. In questo prototipo viene registrato solo il nome del file.</div></div>`;
}

/* ================= scheda di commessa ================= */
function openSheet(c){
  const k=calc(c),s=see();let top=false,logo=null;
  try{top=window.self===window.top;}catch(e){}
  try{logo=localStorage.getItem('rc-logo');}catch(e){}
  const tbl=(head,rows)=>`<div class="tw"><table class="t"><thead><tr>${head.map(h=>`<th class="${h[1]?'num':''}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  let h=`<div class="ov" data-close="1"><div class="mo sheet" role="dialog" aria-label="Scheda di commessa"><div class="sh-h"><div style="min-width:0">${logo?`<img src="${logo}" alt="Logo aziendale">`:''}<div class="lbl" style="margin-top:6px">Scheda di commessa al ${fd(OGGI)}</div><h3 style="font-size:21px">${c.cod} · ${esc(c.cliente)}</h3><div class="muted">${esc(c.oggetto)}</div></div><div class="row noprint" style="align-items:flex-start">${top?'<button class="btn pri" data-print="1">Stampa o salva PDF</button>':''}<button class="btn" data-close="1">Chiudi</button></div></div>`;
  h+=`<div><h4>Anagrafica</h4><dl class="kv"><dt>Stato</dt><dd>${STATI[c.stato]}${c.bloccata?' (bloccata)':''}</dd><dt>Sistema</dt><dd>${esc(c.sistema)}</dd><dt>Cantiere</dt><dd>${esc(c.cantiere)}</dd><dt>Contratto</dt><dd>${fd(c.contratto)}</dd><dt>Commerciale</dt><dd>${esc(c.commerciale)}</dd><dt>Capocantiere</dt><dd>${esc(c.capo||'da assegnare')}</dd><dt>Avanzamento</dt><dd>${k.avanz}% · ${k.ore} h lavorate</dd></dl></div>`;
  if(s.r||s.c)h+=`<div><h4>Conto economico</h4><div class="figs">${s.r?fig('Ricavo totale',eur(k.ricavo)):''}${s.c?fig('Costo a finire',eur(k.eac))+fig('Costi sostenuti',eur(k.sostenuto)):''}${s.m?fig('Margine previsto',`${eur(k.margine)} · ${pct(k.margPct)}`)+fig('Ricavo maturato',eur(k.maturato)):''}${s.r?fig('Fatturato',eur(k.fatturato))+fig('Incassato',eur(k.incassato)):''}</div></div>`;
  if(s.c)h+=`<div><h4>Budget per voce</h4>${tbl([['Voce'],['Budget',1],['Impegnato',1],['Sostenuto',1],['Residuo',1]],k.cats.filter(x=>x.budget||x.imp).map(x=>`<tr><td>${x.k}</td><td class="num">${eur(x.budget)}</td><td class="num">${eur(x.imp)}</td><td class="num">${eur(x.sost)}</td><td class="num">${eur(x.residuo)}</td></tr>`).join(''))}</div>`;
  if(s.r)h+=`<div><h4>Piano di fatturazione</h4>${tbl([['Rata'],['Importo',1],['Stato'],['Fattura']],c.piano.map(p=>`<tr><td>${esc(p.descr)}</td><td class="num">${eur(p.importo)}</td><td>${rata(c,p,k).t}</td><td class="mono">${p.fattura?p.fattura.num:'—'}</td></tr>`).join(''))}</div>`;
  h+=`<div><h4>Documenti</h4>${tbl([['Documento'],['Stato'],['File']],DOCS.map(d=>{const v=c.docs[d.k];return `<tr><td>${d.l}</td><td>${v?'Caricato':dueAt(d,c.stato)?'Mancante':'Non ancora richiesto'}</td><td class="mono">${v?esc(v.file):''}</td></tr>`;}).join(''))}</div>`;
  const ul=D.log.filter(l=>l.cod===c.cod).slice(0,6);
  if(ul.length)h+=`<div><h4>Ultime attività</h4>${tbl([['Data'],['Chi'],['Attività']],ul.map(l=>`<tr><td class="mono">${fd(l.ts.slice(0,10))}</td><td>${esc(l.chi)}</td><td>${esc(l.t)}</td></tr>`).join(''))}</div>`;
  h+=`<p class="muted" style="margin:0;font-size:11.5px">Generata dal Registro Commesse · Responsabile amministrativo: ${esc(D.cfg.resp)} · dati di esempio</p></div></div>`;
  document.getElementById('modal').innerHTML=h;
}

/* ================= report direzionali ================= */
const COLS=[['cod','Commessa'],['cliente','Cliente'],['fase','Fase'],['comm','Commerciale'],['ricavo','Ricavo',1],['eac','Costo a finire',1],['marg','Margine',1],['margPct','Margine %',1],['avanz','Cantiere',1],['fatt','Fatturato',1],['inc','Incassato',1],['cred','Credito',1]];
function portRows(){
  return D.commesse.filter(c=>(!S.rf.fase||String(FASI.findIndex(f=>f.st.includes(c.stato)))===S.rf.fase)&&(!S.rf.comm||c.commerciale===S.rf.comm))
   .map(c=>{const k=calc(c);return {c,cod:c.cod,cliente:c.cliente,fase:STATI[c.stato],fi:c.stato,comm:c.commerciale,ricavo:k.ricavo,eac:k.eac,marg:k.margine,margPct:k.margPct,avanz:k.avanz,fatt:k.fatturato,inc:k.incassato,cred:k.credito};});
}
function licRows(){return D.commesse.filter(c=>c.stato<8).map(c=>{const k=calc(c);return {c,k,diff:k.maturato-k.fatturato};});}
function vReport(){
  const sec=S.rsec;
  const seg=`<div class="seg" role="group" aria-label="Tipo di report">${[['port','Portafoglio'],['scost','Scostamenti'],['lic','Lavori in corso'],['ctrl','Controlli interni']].map(([k,l])=>`<button data-rsec="${k}" aria-pressed="${sec===k}">${l}</button>`).join('')}</div>`;
  return `<div class="stack"><div class="hello"><h2>Report direzionali</h2><div class="row">${seg}<button class="btn pri" data-rel="1">Relazione direzionale</button></div></div>${sec==='scost'?rScost():sec==='lic'?rLic():sec==='ctrl'?rCtrl():rPort()}</div>`;
}
function rPort(){
  const rows=portRows(),{k:sk,d:sd}=S.sort;
  rows.sort((a,b)=>{const x=sk==='fase'?a.fi:a[sk],y=sk==='fase'?b.fi:b[sk];return (x<y?-1:x>y?1:0)*sd;});
  const T=f=>sum(rows,r=>r[f]),tr=T('ricavo'),tm=T('marg'),soglia=D.cfg.sogliaMarg/100;
  const comms=[...new Set(D.commesse.map(c=>c.commerciale))];
  const cell=(r,key)=>{const v=r[key];switch(key){
    case 'cod':return `<td class="mono">${v}</td>`;
    case 'cliente':case 'comm':return `<td>${esc(v)}</td>`;
    case 'fase':return `<td><span class="pill ph" style="--pc:var(${phv(r.fi)})">${v}</span></td>`;
    case 'margPct':{const col=v<soglia?'--bad':v<soglia+.1?'--c-costi':'--good';return `<td class="num"><span class="mbar" style="--c:var(${col})"><i class="grow" style="width:${Math.max(3,Math.min(60,v*120)).toFixed(0)}px"></i>${pct(v)}</span></td>`;}
    case 'avanz':return `<td class="num">${v}%</td>`;
    default:return `<td class="num ${key==='marg'&&v<0?'neg':''}">${eur(v)}</td>`;}};
  return `<section class="panel pad"><div class="sec-h"><div class="filters"><select id="rf-fase" aria-label="Filtra per fase"><option value="">Tutte le fasi</option>${FASI.map((f,i)=>`<option value="${i}" ${S.rf.fase===String(i)?'selected':''}>${f.l}</option>`).join('')}</select><select id="rf-comm" aria-label="Filtra per commerciale"><option value="">Tutti i commerciali</option>${comms.map(x=>`<option ${S.rf.comm===x?'selected':''}>${esc(x)}</option>`).join('')}</select><span class="muted">${rows.length} commesse · clic sulle colonne per ordinare</span></div><div class="row"><button class="btn" data-copy="port">⧉ Copia per Excel</button><button class="btn" data-csv="port">⤓ Scarica CSV</button></div></div>
  <div class="tw"><table class="t"><thead><tr>${COLS.map(([key,l,n])=>`<th class="sort ${n?'num':''}" data-sort="${key}">${l}<span class="ar">${sk===key?(sd>0?'▲':'▼'):''}</span></th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr class="click" data-open="${r.cod}">${COLS.map(([key])=>cell(r,key)).join('')}</tr>`).join('')||`<tr><td colspan="${COLS.length}" class="muted">Nessuna commessa con questi filtri</td></tr>`}</tbody>
  <tfoot><tr><td colspan="4">Totale</td><td class="num">${eur(tr)}</td><td class="num">${eur(T('eac'))}</td><td class="num">${eur(tm)}</td><td class="num">${pct(tr?tm/tr:0)}</td><td></td><td class="num">${eur(T('fatt'))}</td><td class="num">${eur(T('inc'))}</td><td class="num">${eur(T('cred'))}</td></tr></tfoot></table></div></section>`;
}
function rScost(){
  const op=D.commesse.filter(c=>c.stato<8),K=op.map(c=>[c,calc(c)]);
  const agg=CATS.map(cat=>{let b=0,e=0,s=0;K.forEach(([,k])=>{const x=k.cats.find(y=>y.k===cat);b+=x.budget;e+=x.eac;s+=x.sost;});return {k:cat,b,e,s,d:e-b};});
  const mx=Math.max(1,...agg.map(a=>Math.max(a.b,a.e))),tb=sum(agg,a=>a.b),te=sum(agg,a=>a.e);
  const over=[];K.forEach(([c,k])=>k.cats.forEach(x=>{if(x.eac>x.budget+0.5)over.push({c,x,d:x.eac-x.budget});}));over.sort((a,b)=>b.d-a.d);
  return `<section class="panel pad"><div class="sec-h"><h2>Budget e costo a finire per voce</h2><div class="legend"><span style="--c:var(--line)"><i></i>Budget</span><span style="--c:var(--c-costi)"><i></i>Costo a finire</span><span style="--c:var(--bad)"><i></i>Oltre budget</span></div></div>
  ${agg.map(a=>{const ov=a.d>0.5;return `<div class="vbar"><span>${a.k}</span><span class="tr"><i class="b grow" style="width:${(a.b/mx*100).toFixed(1)}%"></i><i class="e grow" style="width:${(a.e/mx*100).toFixed(1)}%;--c:var(${ov?'--bad':'--c-costi'})"></i></span><span class="num ${ov?'neg':'pos'}">${ov?'+':''}${eur(a.d)}</span></div>`;}).join('')}
  <p class="muted" style="margin:10px 0 0;font-size:12.5px">Commesse aperte: budget ${eur(tb)}, costo a finire ${eur(te)}, scostamento ${te>tb?'+':''}${eur(te-tb)} (${pct(tb?(te-tb)/tb:0)})</p></section>
  <section class="panel pad"><div class="sec-h"><h2>Voci oltre budget</h2><p class="muted">Dove si sta perdendo margine</p></div>${over.length?`<div class="tw"><table class="t"><thead><tr><th>Commessa</th><th>Cliente</th><th>Voce</th><th class="num">Budget</th><th class="num">Costo a finire</th><th class="num">Scostamento</th><th class="num">%</th></tr></thead><tbody>${over.map(o=>`<tr class="click" data-open="${o.c.cod}"><td class="mono">${o.c.cod}</td><td>${esc(o.c.cliente)}</td><td>${o.x.k}</td><td class="num">${eur(o.x.budget)}</td><td class="num">${eur(o.x.eac)}</td><td class="num neg">+${eur(o.d)}</td><td class="num neg">${o.x.budget?pct(o.d/o.x.budget):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted" style="margin:0">Nessuna voce oltre budget.</p>'}</section>`;
}
function rLic(){
  const rows=licRows(),pos=sum(rows.filter(r=>r.diff>0),r=>r.diff),neg=sum(rows.filter(r=>r.diff<0),r=>-r.diff);
  return `<section class="panel pad"><div class="sec-h"><h2>Lavori in corso su ordinazione al ${fd(OGGI)}</h2><div class="row"><button class="btn" data-copy="lic">⧉ Copia per Excel</button><button class="btn" data-csv="lic">⤓ Scarica CSV</button></div></div>
  <p class="muted" style="margin:-4px 0 12px;font-size:12.5px;max-width:80ch">Criterio della percentuale di completamento (OIC 23), metodo cost-to-cost: ricavo maturato = ricavo totale × costi sostenuti ÷ costo a finire.</p>
  <div class="tw"><table class="t"><thead><tr><th>Commessa</th><th>Cliente</th><th class="num">Ricavo totale</th><th class="num">Completamento</th><th class="num">Maturato</th><th class="num">Fatturato</th><th class="num">Lavori in corso</th><th class="num">Fatturato in eccesso</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="click" data-open="${r.c.cod}"><td class="mono">${r.c.cod}</td><td>${esc(r.c.cliente)}</td><td class="num">${eur(r.k.ricavo)}</td><td class="num">${pct(r.k.c2c)}</td><td class="num">${eur(r.k.maturato)}</td><td class="num">${eur(r.k.fatturato)}</td><td class="num ${r.diff>0?'pos':''}">${r.diff>0?eur(r.diff):'—'}</td><td class="num ${r.diff<0?'wrn':''}">${r.diff<0?eur(-r.diff):'—'}</td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="6">Totale</td><td class="num">${eur(pos)}</td><td class="num">${eur(neg)}</td></tr></tfoot></table></div></section>
  <section class="panel pad"><div class="sec-h"><h2>Scrittura di assestamento proposta</h2><button class="btn" data-copy="entry">⧉ Copia scrittura</button></div>
  <div class="entry"><span class="h">Conto</span><span class="h r">Dare</span><span class="h r">Avere</span>
   <span>Lavori in corso su ordinazione (SP, C.I.3)</span><span class="r">${eur(pos)}</span><span class="r"></span>
   <span>Variazione dei lavori in corso su ordinazione (CE, A.3)</span><span class="r"></span><span class="r">${eur(pos)}</span></div>
  <div class="note" style="margin-top:12px">Proposta di lavoro da validare in sede di chiusura: non considera le rimanenze iniziali dell'esercizio. Le commesse con fatturato superiore al maturato (${eur(neg)}) vanno analizzate: la parte di anticipi non ancora maturata va esposta tra gli acconti nel passivo (D.6) e non tra i ricavi.</div></section>`;
}
function copyTSV(rows){
  const txt=rows.map(r=>r.map(v=>typeof v==='number'?String(Math.round(v*100)/100).replace('.',','):String(v)).join('\t')).join('\n');
  const fb=()=>{modal('Copia la tabella','<p class="muted" style="margin:0">Il testo è già selezionato: premi Ctrl+C e incolla in Excel.</p><textarea id="cp" rows="8" style="width:100%;font-family:var(--f-mono);font-size:12px" readonly>'+esc(txt)+'</textarea>','Chiudi',()=>null);setTimeout(()=>{const t=document.getElementById('cp');if(t){t.focus();t.select();}},30);};
  try{navigator.clipboard.writeText(txt).then(()=>toast('Copiato: incolla direttamente in Excel'),fb);}catch(e){fb();}
}
function rowsOf(w){
  let rows;
  if(w==='port')rows=[COLS.map(c=>c[1])].concat(portRows().map(r=>COLS.map(([k])=>k==='margPct'?Math.round(r[k]*1000)/10:r[k])));
  else if(w==='lic')rows=[['Commessa','Cliente','Ricavo totale','Completamento %','Maturato','Fatturato','Lavori in corso','Fatturato in eccesso']].concat(licRows().map(r=>[r.c.cod,r.c.cliente,r.k.ricavo,Math.round(r.k.c2c*1000)/10,r.k.maturato,r.k.fatturato,Math.max(0,r.diff),Math.max(0,-r.diff)]));
  else if(EXTRA[w])rows=EXTRA[w]();
  else{const pos=sum(licRows().filter(r=>r.diff>0),r=>r.diff);rows=[['Conto','Dare','Avere'],['Lavori in corso su ordinazione (SP C.I.3)',pos,''],['Variazione dei lavori in corso su ordinazione (CE A.3)','',pos]];}
  return rows;
}
function doCopy(w){copyTSV(rowsOf(w));}


/* ================= v5: scadenzario, anagrafiche, controlli, esportazioni ================= */
const BANDS=['Scaduto','Entro 30 giorni','31–60 giorni','61–90 giorni','Oltre 90 giorni'];
const bandOf=due=>{const d=days(OGGI,due);return d<0?0:d<=30?1:d<=60?2:d<=90?3:4;};
function scadRows(){
  const inc=[],pag=[];
  D.commesse.forEach(c=>{const k=calc(c);
    c.piano.forEach(p=>{if(p.incasso)return;
      if(p.fattura)inc.push({c,p,cod:c.cod,who:c.cliente,doc:p.fattura.num,due:p.fattura.scad,imp:p.importo,sure:1});
      else if(rata(c,p,k).fb)inc.push({c,p,cod:c.cod,who:c.cliente,doc:p.descr,due:addDays(OGGI,D.cfg.ggPag),imp:p.importo,sure:0});});
    c.fp.forEach((f,i)=>{if(f.pag)return;pag.push({c,f,i,cod:c.cod,who:f.fornitore,doc:f.num,due:addDays(f.data,D.cfg.ggForn),imp:f.importo});});});
  inc.sort((a,b)=>a.due<b.due?-1:1);pag.sort((a,b)=>a.due<b.due?-1:1);
  return {inc,pag,late:inc.filter(x=>x.sure&&x.due<OGGI).length+pag.filter(x=>x.due<OGGI).length};
}
function stDue(due,sure){const d=days(OGGI,due);return !sure?`<span class="pill ph" style="--pc:var(--muted)">Stima: da fatturare</span>`:d<0?`<span class="pill ph" style="--pc:var(--bad)">Scaduta da ${-d} gg</span>`:d<=7?`<span class="pill ph" style="--pc:var(--warn)">Scade tra ${d} gg</span>`:`<span class="pill ph" style="--pc:var(--c-fatt)">Scade tra ${d} gg</span>`;}
function vScadenzario(){
  const {inc,pag}=scadRows(),sec=S.ssec,adm=is('admin');
  const em=inc.filter(x=>x.sure),cred=sum(em,x=>x.imp),credL=sum(em.filter(x=>x.due<OGGI),x=>x.imp);
  const deb=sum(pag,x=>x.imp),debL=sum(pag.filter(x=>x.due<OGGI),x=>x.imp);
  const f90=addDays(OGGI,90),in90=sum(inc.filter(x=>x.due<=f90),x=>x.imp),out90=sum(pag.filter(x=>x.due<=f90),x=>x.imp);
  const seg=`<div class="seg" role="group" aria-label="Scadenzario">${[['inc','Incassi da clienti'],['pag','Pagamenti ai fornitori'],['prev','Previsione di cassa']].map(([k,l])=>`<button data-ssec="${k}" aria-pressed="${sec===k}">${l}</button>`).join('')}</div>`;
  const figs=`<section class="panel pad"><div class="figs">${fig('Crediti verso clienti',eur(cred))}${fig('di cui scaduti',eur(credL),credL?'neg':'')}${fig('Debiti verso fornitori',eur(deb))}${fig('di cui scaduti',eur(debL),debL?'neg':'')}${fig('Saldo atteso a 90 giorni',eur(in90-out90),in90-out90<0?'neg':'pos')}</div></section>`;
  const aging=(rows,tone)=>{const b=BANDS.map(()=>0);rows.forEach(x=>{b[bandOf(x.due)]+=x.imp;});return `<div class="age">${BANDS.map((l,i)=>`<div class="${i===0&&b[0]?'late':''}"><span class="lbl">${l}</span><span class="v ${i===0&&b[0]?'neg':''}">${eur(b[i])}</span></div>`).join('')}</div>`;};
  let body='';
  if(sec==='inc'){
    body=`<section class="panel pad"><div class="sec-h"><h2>Anzianità dei crediti</h2></div>${aging(inc)}<p class="muted" style="margin:10px 0 0;font-size:12.5px">Comprese le rate già fatturabili, stimate a ${D.cfg.ggPag} giorni dall'emissione.</p></section>
    <section class="panel pad"><div class="sec-h"><h2>Dettaglio incassi</h2><button class="btn" data-csv="inc">⤓ Scarica CSV</button></div>${inc.length?`<div class="tw"><table class="t"><thead><tr><th>Scadenza</th><th>Commessa</th><th>Cliente</th><th>Documento</th><th class="num">Importo</th><th>Stato</th></tr></thead><tbody>${inc.map(x=>`<tr class="click" data-open="${x.cod}"><td class="mono">${fd(x.due)}</td><td class="mono">${x.cod}</td><td>${esc(x.who)}</td><td>${esc(x.doc)}</td><td class="num">${eur(x.imp)}</td><td>${stDue(x.due,x.sure)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted" style="margin:0">Nessun incasso in attesa.</p>'}</section>`;
  }else if(sec==='pag'){
    body=`<section class="panel pad"><div class="sec-h"><h2>Anzianità dei debiti</h2></div>${aging(pag)}<p class="muted" style="margin:10px 0 0;font-size:12.5px">Scadenza calcolata a ${D.cfg.ggForn} giorni dalla data fattura. Modificabile nelle impostazioni.</p></section>
    <section class="panel pad"><div class="sec-h"><h2>Dettaglio pagamenti</h2><button class="btn" data-csv="pag">⤓ Scarica CSV</button></div>${pag.length?`<div class="tw"><table class="t"><thead><tr><th>Scadenza</th><th>Commessa</th><th>Fornitore</th><th>Fattura</th><th class="num">Importo</th><th>Stato</th>${adm?'<th></th>':''}</tr></thead><tbody>${pag.map(x=>`<tr class="click" data-open="${x.cod}"><td class="mono">${fd(x.due)}</td><td class="mono">${x.cod}</td><td>${esc(x.who)}</td><td>${esc(x.doc)}</td><td class="num">${eur(x.imp)}</td><td>${stDue(x.due,1)}</td>${adm?`<td><button class="btn" data-act="pag" data-id="${x.cod}|${x.i}">Registra pagamento</button></td>`:''}</tr>`).join('')}</tbody></table></div>`:'<p class="muted" style="margin:0">Nessun debito aperto verso fornitori.</p>'}</section>`;
  }else{
    const wk=Array.from({length:13},(_,i)=>({i,a:0,b:0,o:0,cum:0}));
    inc.forEach(x=>{const w=Math.floor(Math.max(0,days(OGGI,x.due))/7);if(w<13)wk[w][x.sure?'a':'b']+=x.imp;});
    pag.forEach(x=>{const w=Math.floor(Math.max(0,days(OGGI,x.due))/7);if(w<13)wk[w].o+=x.imp;});
    let cum=0;wk.forEach(w=>{cum+=w.a+w.b-w.o;w.cum=cum;});
    const mx=Math.max(1,...wk.map(w=>Math.max(w.a+w.b,w.o)));
    const H=v=>`${(v/mx*100).toFixed(1)}%`;
    body=`<section class="panel pad"><div class="sec-h"><h2>Previsione di cassa a 13 settimane</h2><div class="legend"><span style="--c:var(--c-inc)"><i></i>Incassi da fatture</span><span style="--c:color-mix(in srgb,var(--c-inc) 35%,var(--sunk))"><i></i>Incassi stimati</span><span style="--c:var(--c-costi)"><i></i>Pagamenti</span></div></div>
    <div class="tw"><div class="fc">${wk.map(w=>`<div class="w" title="Settimana dal ${fd(addDays(OGGI,7*w.i))}: incassi ${eur(w.a+w.b)}, pagamenti ${eur(w.o)}"><span class="bars">${w.a?`<i class="up" style="height:${H(w.a)};background:var(--c-inc)"></i>`:''}${w.b?`<i class="up" style="height:${H(w.b)};background:color-mix(in srgb,var(--c-inc) 35%,var(--sunk))"></i>`:''}${w.o?`<i class="up" style="height:${H(w.o)};background:var(--c-costi)"></i>`:''}</span><span class="wl">${fd(addDays(OGGI,7*w.i)).slice(0,5)}</span><span class="sd ${w.cum<0?'neg':''}">${kE(w.cum)}</span></div>`).join('')}</div></div>
    <p class="muted" style="margin:10px 0 0;font-size:12.5px">Sotto ogni settimana il saldo cumulato di incassi e pagamenti già noti. Le scadenze passate sono nella prima settimana. Non include stipendi, imposte e altre uscite non legate alle commesse: aggiungerle prima di usarla come piano di tesoreria.</p></section>
    <section class="panel pad"><div class="sec-h"><h2>Sintesi a 90 giorni</h2></div><div class="figs">${fig('Incassi attesi',eur(in90),'pos')}${fig('Pagamenti attesi',eur(out90))}${fig('Saldo netto',eur(in90-out90),in90-out90<0?'neg':'pos')}${fig('Punto più basso',eur(Math.min(0,...wk.map(w=>w.cum))),Math.min(0,...wk.map(w=>w.cum))<0?'neg':'')}</div></section>`;
  }
  return `<div class="stack"><div class="hello"><h2>Scadenzario</h2>${seg}</div>${figs}${body}</div>`;
}
function cliRows(){
  const m={};
  D.commesse.forEach(c=>{const k=calc(c),r=m[c.cliente]||(m[c.cliente]={nome:c.cliente,n:0,ricavo:0,fatt:0,inc:0,cred:0,scad:0,marg:0});
    r.n++;r.ricavo+=k.ricavo;r.fatt+=k.fatturato;r.inc+=k.incassato;r.cred+=k.credito;r.marg+=k.margine;
    c.piano.forEach(p=>{if(p.fattura&&!p.incasso&&p.fattura.scad<OGGI)r.scad+=p.importo;});});
  return Object.values(m).sort((a,b)=>b.ricavo-a.ricavo);
}
function forRows(){
  const m={},g=n=>m[n]||(m[n]={nome:n,n:0,ord:0,fatt:0,pagare:0,scad:0,sdi:0,comm:new Set()});
  D.commesse.forEach(c=>{
    c.ordini.forEach(o=>{if(o.stato==='Autorizzazione richiesta'||o.stato==='Respinto')return;const r=g(o.fornitore);r.n++;r.ord+=o.importo;r.comm.add(c.cod);});
    c.fp.forEach(f=>{const r=g(f.fornitore);r.fatt+=f.importo;r.comm.add(c.cod);if(!f.pag){r.pagare+=f.importo;if(addDays(f.data,D.cfg.ggForn)<OGGI)r.scad+=f.importo;}});});
  D.sdi.forEach(f=>{g(f.fornitore).sdi++;});
  return Object.values(m).map(r=>({...r,comm:[...r.comm]})).sort((a,b)=>b.ord-a.ord);
}
function vAnagrafiche(){
  const sec=S.asec;
  const seg=`<div class="seg" role="group" aria-label="Anagrafiche">${[['cli','Clienti'],['for','Fornitori']].map(([k,l])=>`<button data-asec="${k}" aria-pressed="${sec===k}">${l}</button>`).join('')}</div>`;
  let body;
  if(sec==='cli'){

function squarify(items,x,y,w,h){
  const out=[],tot=sum(items,i=>i.v);let rest=items.map(i=>({...i,a:i.v/tot*w*h}));
  const worst=(row,side)=>{const s=sum(row,i=>i.a),mx=Math.max(...row.map(i=>i.a)),mn=Math.min(...row.map(i=>i.a));return Math.max(side*side*mx/(s*s),s*s/(side*side*mn));};
  while(rest.length){const side=Math.min(w,h);let row=[rest[0]],k=1;
    while(k<rest.length&&worst(row.concat(rest[k]),side)<=worst(row,side)){row.push(rest[k]);k++;}
    const sa=sum(row,i=>i.a);
    if(w>=h){const rw=sa/h;let yy=y;row.forEach(i=>{const hh=i.a/rw;out.push({...i,x,y:yy,w:rw,h:hh});yy+=hh;});x+=rw;w-=rw;}
    else{const rh=sa/w;let xx=x;row.forEach(i=>{const ww=i.a/rh;out.push({...i,x:xx,y,w:ww,h:rh});xx+=ww;});y+=rh;h-=rh;}
    rest=rest.slice(row.length);}
  return out;
}

  if(t.dataset.rsec){S.rsec=t.dataset.rsec;S.anim=true;render();return;}

  if(t.dataset.imp){impAct(t.dataset.imp);return;}
  if(t.dataset.per){const a=t.dataset.per;if(a.startsWith('g:')){S.per.g=a.slice(2);S.per.b=null;}else if(a.startsWith('b:')){const b=+a.slice(2);S.per.b=S.per.b===b?null:b;}S.anim=true;render();return;}
  if(t.dataset.tm){S.tm=t.dataset.tm;render();return;}
  if(t.dataset.peek){openPeek(t.dataset.peek);return;}
  if(t.dataset.pkclose){if(e.target===t||t.classList.contains('x'))closePeek();return;}
  if(t.dataset.pk){const cod=S.peek;closePeek();if(t.dataset.pk==='open'){S.view='commesse';S.sel=cod;S.anim=true;render();window.scrollTo({top:0});}else if(t.dataset.pk==='sheet'){const c=C(cod);if(c)openSheet(c);}return;}

  if(t.dataset.rel){openReport();return;}

  if(t.dataset.ssec){S.ssec=t.dataset.ssec;S.anim=true;render();return;}
