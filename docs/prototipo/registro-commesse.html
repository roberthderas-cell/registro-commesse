  if(t.dataset.view){S.view=t.dataset.view;S.anim=true;render();return;}
  if(t.dataset.open&&S.view!=='commesse'&&S.view!=='pipeline'&&!e.ctrlKey&&!e.metaKey&&!t.classList.contains('ci')&&!t.classList.contains('pcard')){openPeek(t.dataset.open);return;}
  if(t.dataset.open){S.view='commesse';S.sel=t.dataset.open;S.anim=true;render();window.scrollTo({top:0});return;}
  if(t.dataset.tab){S.tab=t.dataset.tab;S.anim=true;render();return;}
  if(t.dataset.tlf){S.tlOff[t.dataset.tlf]=!S.tlOff[t.dataset.tlf];render();return;}
  if(t.dataset.alert){const a=alerts()[+t.dataset.alert];if(!a)return;if(a.go.view)S.view=a.go.view;else{S.view='commesse';S.sel=a.cod;S.tab=TABS[S.role].includes(a.go.tab)?a.go.tab:TABS[S.role][0];}S.anim=true;render();window.scrollTo({top:0});return;}
  if(t.dataset.act)act(t.dataset.act,t.dataset.id);
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();if(S.pal)closePal();else openPal();return;}
  if(S.pal){
    if(e.key==='Escape'){e.preventDefault();closePal();return;}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();S.pal.i+=e.key==='ArrowDown'?1:-1;renderPal();return;}
    if(e.key==='Enter'){e.preventDefault();palRun(S.pal.i);return;}
    return;
  }
  if(e.key==='Escape'){if(document.getElementById('modal').innerHTML)closeModal();else if(S.tour!=null){S.tour=null;render();}}
});
document.addEventListener('change',e=>{const id=e.target&&e.target.id;
  if(id==='rf-fase'||id==='rf-comm'){S.rf[id==='rf-fase'?'fase':'comm']=e.target.value;render();}
  if(id==='per-y'){S.per.y=+e.target.value;S.per.b=null;render();}
  if(id==='per-c'){S.per.c=e.target.value;render();}
  if(id==='lf-rk'){S.lf.rk=e.target.value;render();}
  if(id==='lf-q'){S.lf.q=e.target.value;render();}
  if(id==='imp-f'){const f=e.target.files&&e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{S.imp.txt=String(r.result);S.imp.res=impCheck(S.imp.tipo,S.imp.txt);render();};r.readAsText(f);}e.target.value='';}
  if(id==='bk-in'){const f=e.target.files&&e.target.files[0];if(f)importBackup(f);e.target.value='';}
  if(id==='d-f'){const f=e.target.files&&e.target.files[0],n=document.getElementById('d-n');if(f&&n)n.value=f.name;}});
document.addEventListener('submit',e=>{if(!e.target||e.target.id!=='cfgf')return;e.preventDefault();
  const g=id=>parseFloat(String(document.getElementById(id).value).replace(',','.'));
  const v={costoOra:g('cf-ora'),sogliaMarg:g('cf-marg'),sogliaGap:g('cf-gap'),ggPag:Math.round(g('cf-gg')),ggForn:Math.round(g('cf-gf')),resp:String(document.getElementById('cf-resp').value).trim().slice(0,60)};
  if(!(v.costoOra>0&&v.costoOra<500)||!(v.sogliaMarg>=0&&v.sogliaMarg<100)||!(v.sogliaGap>0&&v.sogliaGap<100)||!(v.ggPag>=0&&v.ggPag<=365)||!(v.ggForn>=0&&v.ggForn<=365)||!v.resp){toast('Controlla i valori: costo orario tra 0 e 500, percentuali tra 0 e 100, giorni tra 0 e 365, responsabile indicato','warn');return;}
  D.cfg=v;addLog(null,`Impostazioni aggiornate: ${v.costoOra} €/h, margine minimo ${v.sogliaMarg}%, scarto ${v.sogliaGap} punti, pagamento clienti a ${v.ggPag} giorni, fornitori a ${v.ggForn}`);toast('Impostazioni salvate');S.anim=true;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.peek){closePeek();}});
let gP=0;
document.addEventListener('keydown',e=>{const t=e.target;if((t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))||e.ctrlKey||e.metaKey||e.altKey||S.pal)return;
  if(e.key==='?'){showKeys();return;}
  if(e.key==='g'||e.key==='G'){gP=Date.now();return;}
  if(Date.now()-gP<1200){gP=0;const m={c:'cruscotto',p:'pipeline',m:'commesse',b:'bi',t:'periodi',r:'report',s:'scadenzario',a:'anagrafiche',i:'importa',l:'log'},v=m[String(e.key).toLowerCase()];
    if(v&&views().some(x=>x[0]===v)){S.view=v;S.anim=true;closePeek();render();window.scrollTo({top:0});}}});
document.addEventListener('pointermove',e=>{const t=e.target&&e.target.closest&&e.target.closest('.kpi,.fnode,.tile,.pcard');if(!t)return;const r=t.getBoundingClientRect();t.style.setProperty('--mx',(e.clientX-r.left)+'px');t.style.setProperty('--my',(e.clientY-r.top)+'px');},{passive:true});
(function(){const b=document.getElementById('railBtn');if(!b)return;
  const set=on=>{document.body.classList.toggle('rail',on);b.title=on?'Espandi il menu':'Comprimi il menu';try{localStorage.setItem('rc-rail',on?'1':'0');}catch(x){}};
  let on=false;try{on=localStorage.getItem('rc-rail')==='1';}catch(x){}
  if(on)set(true);
  b.addEventListener('click',()=>{on=!on;set(on);});})();

(function(){const b=document.getElementById('demoBtn'),pn=document.getElementById('demoPanel');
 const set=o=>{pn.hidden=!o;b.setAttribute('aria-expanded',o?'true':'false');};
 b.addEventListener('click',e=>{e.stopPropagation();set(pn.hidden);});
 pn.addEventListener('click',e=>{if(e.target.closest('button'))setTimeout(()=>set(false),0);});

document.getElementById('tourBtn').addEventListener('click',startTour);

document.addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.sim){const k=t.dataset.sim,v=parseFloat(t.value);if(!isNaN(v)){S.bi.w[k]=v;const o=document.getElementById('bi-out');if(o)o.innerHTML=biSimBody();const l=document.getElementById('sl-'+k);if(l)l.textContent=simLab(k,v);}return;}
  if(e.target&&e.target.id==='q'){S.q=e.target.value;S.qFocus=true;render();}});
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;dragCod=el.dataset.drag;el.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragCod);e.dataTransfer.effectAllowed='move';}catch(x){}});
document.addEventListener('dragend',()=>{dragCod=null;document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col||!dragCod)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>{if(x!==col)x.classList.remove('over');});col.classList.add('over');});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col||!dragCod)return;e.preventDefault();const cod=dragCod;dragCod=null;col.classList.remove('over');dropTo(cod,+col.dataset.drop);});

/* logo: caricato dall'utente, conservato solo in questo browser */
const logoBtn=document.getElementById('logoBtn'),logoIn=document.getElementById('logoIn');
function showLogo(src){if(src){logoBtn.classList.remove('empty');logoBtn.innerHTML='';const im=document.createElement('img');im.alt='Logo aziendale';im.src=src;logoBtn.appendChild(im);logoBtn.title='Clicca per cambiare logo';}else{logoBtn.classList.add('empty');logoBtn.innerHTML='Carica<br>logo';}}
try{showLogo(localStorage.getItem('rc-logo'));}catch(e){}
logoBtn.addEventListener('click',()=>logoIn.click());
logoIn.addEventListener('change',()=>{const f=logoIn.files&&logoIn.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{showLogo(r.result);try{localStorage.setItem('rc-logo',r.result);}catch(e){}toast('Logo caricato');};r.readAsDataURL(f);logoIn.value='';});

render();
